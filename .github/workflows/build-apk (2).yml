name: Build Budget APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in icon.png www/index.html package.json capacitor.config.json; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in repo: $f"; exit 1; fi
          done
          echo "All required files found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make icons and splash from icon.png
        run: |
          rm -rf resources
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import os
          src = Image.open('icon.png').convert('RGB')
          src = src.resize((1254, 1254), Image.LANCZOS)
          BG = (245, 245, 249)
          tile = src.crop((62, 62, 1190, 1165))
          S = max(tile.size)
          sq = Image.new('RGB', (S, S), BG)
          sq.paste(tile, ((S - tile.width) // 2, (S - tile.height) // 2))
          wal = src.crop((190, 190, 1110, 1020))
          def rounded(img, size, r=0.225):
              img = img.resize((size, size), Image.LANCZOS).convert('RGBA')
              m = Image.new('L', (size * 4, size * 4), 0)
              ImageDraw.Draw(m).rounded_rectangle((0, 0, size * 4 - 1, size * 4 - 1), radius=int(size * 4 * r), fill=255)
              img.putalpha(m.resize((size, size), Image.LANCZOS))
              return img
          def circle(img, size):
              img = img.resize((size, size), Image.LANCZOS).convert('RGBA')
              m = Image.new('L', (size * 4, size * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, size * 4 - 1, size * 4 - 1), fill=255)
              img.putalpha(m.resize((size, size), Image.LANCZOS))
              return img
          def foreground(size):
              canvas = Image.new('RGBA', (size, size), BG + (0,))
              t = int(size * 0.60)
              w = wal.copy()
              k = t / max(w.size)
              w = w.resize((int(w.width * k), int(w.height * k)), Image.LANCZOS).convert('RGBA')
              f = max(2, int(size * 0.035))
              m = Image.new('L', w.size, 0)
              ImageDraw.Draw(m).rectangle((f, f, w.width - f, w.height - f), fill=255)
              w.putalpha(m.filter(ImageFilter.GaussianBlur(f * 0.8)))
              canvas.alpha_composite(w, ((size - w.width) // 2, (size - w.height) // 2))
              return canvas
          os.makedirs('resources/android', exist_ok=True)
          for d, (l, a) in {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}.items():
              p = 'resources/android/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              rounded(sq, l).save(p + '/ic_launcher.png')
              circle(sq.crop((int(S * .04), int(S * .04), int(S * .96), int(S * .96))), l).save(p + '/ic_launcher_round.png')
              foreground(a).save(p + '/ic_launcher_foreground.png')
          for n in (32, 48, 72, 96, 144, 180, 192, 512, 1024):
              rounded(sq, n).save('www/app-icon-%d.png' % n)
          sp = Image.new('RGB', (2732, 2732), BG)
          ic = rounded(sq, 720)
          sp.paste(ic, ((2732 - 720) // 2, (2732 - 720) // 2), ic)
          sp.save('resources/splash.png')
          print('icons + splash done')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Apply icon + splash to Android
        run: |
          node - <<'JS'
          const fs = require('fs'), path = require('path');
          const RES = 'android/app/src/main/res';
          const src = 'resources/android';
          for (const dir of fs.readdirSync(src)) {
            const to = path.join(RES, dir); fs.mkdirSync(to, { recursive: true });
            for (const e of fs.readdirSync(path.join(src, dir), { withFileTypes: true })) {
              if (e.isFile()) fs.copyFileSync(path.join(src, dir, e.name), path.join(to, e.name));
            }
          }
          fs.writeFileSync(path.join(RES, 'values/ic_launcher_background.xml'),
            '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#F5F5F9</color>\n</resources>\n');
          for (const d of fs.readdirSync(RES).filter(d => /^drawable/.test(d))) {
            const f = path.join(RES, d, 'splash.png');
            if (fs.existsSync(f)) fs.copyFileSync('resources/splash.png', f);
          }
          const sf = path.join(RES, 'values/styles.xml');
          let x = fs.readFileSync(sf, 'utf8');
          if (!x.includes('windowSplashScreenBackground')) {
            x = x.replace(/(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)/,
              '$1\n        <item name="windowSplashScreenBackground">#F5F5F9</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>');
            fs.writeFileSync(sf, x);
          }
          console.log('icon + splash applied');
          JS

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Budget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
